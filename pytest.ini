[pytest]
testpaths = tests
addopts = -v --strict-markers --dist loadgroup
markers =
    smoke: Critical build/deployment smoke tests
    regression: Full regression tests
    api: API-level tests
    critical: Business-critical workflows
    auth: Authentication and authorization tests
    dashboard: TC dashboard tests
    user_management: User management (OEM, RTO, Inspector, Driver, Staff) tests
    negative: Negative / input-validation tests
    permissions: Staff permission (RBAC) tests
    oem_management: OEM Management (Device Models, Firmware, SIM Modules) tests
    configuration: System configuration tests
    oem_panel: OEM panel (devices, allocation, commands, fitment centres, reports) tests
    fc_panel: Fitment Centre panel (dashboard, operations, installation) tests
    driver_panel: Driver panel (dashboard, duties) tests
    inspector_panel: RTO Inspector panel (dashboard, verify fitment, challans) tests
    rto_panel: RTO Officer panel (dashboard, installation approvals, permit holders, challans) tests
    ui_ux: UI/UX and accessibility (WCAG) audit regression checks
    permit_holder_panel: Permit Holder (Fleet Owner) panel tests
